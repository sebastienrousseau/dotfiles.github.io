{{#extends "base"}}
{{#block "main"}}
<!-- dotfiles.io home: Lucid's landing hero (as on doc.dotfiles.io), then
     the bands in content/index.md, written with Lucid's own classes. -->
<section class="hero" aria-labelledby="hero-h">
  <div class="lu-shell hero-in">
    <p class="eyebrow"><span class="eyebrow-tag">{{hero_tag}}</span> {{hero_tagline}}</p>
    <h1 id="hero-h" class="hero-h">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <p class="hero-actions">
      <a class="btn btn-primary" href="{{root}}#install">{{cta_primary}}</a>
      <a class="btn btn-quiet" href="{{docs_url}}">{{cta_secondary}}</a>
    </p>
  </div>
</section>
{{!content}}
{{/block}}
