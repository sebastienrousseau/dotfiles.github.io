<!DOCTYPE html>
<html lang="{{ site.language | default(value='en-GB') }}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>{% block title %}{{ page.title }} — {{ site.site_name }}{% endblock %}</title>
  
  <meta name="description" content="{{ page.description | default(value=site.site_description) }}">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
  <meta name="author" content="{{ page.author | default(value=site.site_name) }}">
  <meta name="robots" content="{{ page.robots | default(value='index, follow') }}">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  
  {% if site.base_url %}<link rel="canonical" href="{{ site.base_url }}{{ page.url | default(value='/') }}">{% endif %}

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.site_name }}">
  <meta property="og:url" content="{{ site.base_url }}{{ page.url | default(value='/') }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | default(value=site.site_description) }}">
  <meta property="og:locale" content="{{ site.language | default(value='en_GB') }}">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description | default(value=site.site_description) }}">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "{{ site.base_url }}/#website",
        "url": "{{ site.base_url }}",
        "name": "{{ site.site_name }}",
        "description": "{{ site.site_description }}",
        "inLanguage": "{{ site.language | default(value='en-GB') }}"
      },
      {
        "@type": "WebPage",
        "@id": "{{ site.base_url }}{{ page.url | default(value='/') }}#webpage",
        "url": "{{ site.base_url }}{{ page.url | default(value='/') }}",
        "name": "{{ page.title }}",
        "description": "{{ page.description | default(value=site.site_description) }}",
        "isPartOf": { "@id": "{{ site.base_url }}/#website" },
        "inLanguage": "{{ site.language | default(value='en-GB') }}"
      }
    ]
  }
  </script>

/* Modern Apple-Grade Reset & Theme Enhancements Powered by Skeletonic */
@layer skeletonic.themes {
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
    
    --bg-canvas: light-dark(#fbfbfd, #000000);
    --bg-surface: light-dark(#ffffff, #161617);
    --bg-subtle: light-dark(#f5f5f7, #1d1d1f);
    --bg-glass: light-dark(rgba(255, 255, 255, 0.82), rgba(22, 22, 23, 0.82));
    
    --text-headline: light-dark(#1d1d1f, #f5f5f7);
    --text-body: light-dark(#1d1d1f, #f5f5f7);
    --text-muted: light-dark(#6e6e73, #a1a1a6);
    
    --border-hairline: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.12));
    --border-subtle: light-dark(rgba(0, 0, 0, 0.12), rgba(255, 255, 255, 0.18));
    
    --radius-pill: 980px;
    --radius-card: 24px;
    --radius-btn: 980px;
    
    --shadow-card: light-dark(0 8px 30px rgba(0, 0, 0, 0.06), 0 8px 30px rgba(0, 0, 0, 0.35));
    --container-max: 68rem;
  }

  /* Theme Accents (OKLCH Native Diversity) */
  body[data-theme="apex"], .theme-apex { --cl-primary: light-dark(oklch(0.42 0.22 260), oklch(0.72 0.18 260)); }
  body[data-theme="atlas"], .theme-atlas { --cl-primary: light-dark(oklch(0.40 0.18 220), oklch(0.70 0.15 220)); }
  body[data-theme="kinetic"], .theme-kinetic { --cl-primary: light-dark(oklch(0.50 0.24 25), oklch(0.75 0.20 25)); }
  body[data-theme="lucid"], .theme-lucid { --cl-primary: light-dark(oklch(0.44 0.20 190), oklch(0.72 0.16 190)); }
  body[data-theme="quill"], .theme-quill { --cl-primary: light-dark(oklch(0.38 0.14 150), oklch(0.68 0.12 150)); }
  body[data-theme="stablo"], .theme-stablo { --cl-primary: light-dark(oklch(0.46 0.22 300), oklch(0.74 0.18 300)); }
  body[data-theme="velocity"], .theme-velocity { --cl-primary: light-dark(oklch(0.48 0.22 45), oklch(0.74 0.18 45)); }
  body[data-theme="voxt"], .theme-voxt { --cl-primary: light-dark(oklch(0.40 0.20 280), oklch(0.70 0.16 280)); }

  html {
    font-family: var(--font-sans);
    background-color: var(--bg-canvas);
    color: var(--text-body);
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
  }

  /* Navbar Glassmorphism */
  nav, .navbar {
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    background-color: var(--bg-glass) !important;
    border-bottom: 1px solid var(--border-hairline) !important;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  /* Button Affordances */
  .btn, button, a.btn {
    font-family: var(--font-sans);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: -0.012em;
    padding: 0.65rem 1.4rem;
    border-radius: var(--radius-pill);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .btn-primary, .btn-dark, a.btn-dark {
    background-color: var(--cl-primary) !important;
    color: #ffffff !important;
  }

  .btn-primary:hover, .btn-dark:hover, a.btn-dark:hover {
    filter: brightness(1.08);
    transform: scale(1.02);
  }

  .btn-outline-dark, a.btn-outline-dark {
    background-color: transparent !important;
    color: var(--text-headline) !important;
    border-color: var(--border-subtle) !important;
  }

  /* Cards & Elevational Surfaces */
  .card, .container-card {
    background-color: var(--bg-surface);
    border-radius: var(--radius-card);
    border: 1px solid var(--border-hairline);
    box-shadow: var(--shadow-card);
    padding: 2.5rem;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
  }

  :focus-visible {
    outline: 3px solid var(--cl-primary);
    outline-offset: 3px;
  }
}

  backdrop-filter: blur(8px);
}
.search-dialog {
  position: relative;
  width: 90%;
  max-width: 580px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.search-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-hairline);
}
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-headline);
  font-size: 1.1rem;
  outline: none;
}
.search-close {
  background: none;
  border: none;
  color: var(--text-headline);
  font-size: 1rem;
  cursor: pointer;
  padding: 4px 8px;
}
.search-results {
  max-height: 50vh;
  overflow-y: auto;
  padding: 8px 0;
}
.search-item {
  padding: 10px 18px;
  display: block;
  text-decoration: none;
  color: var(--text-headline);
  border-bottom: 1px solid var(--border-hairline);
  transition: background 0.15s ease;
}
.search-item:hover, .search-item.selected {
  background: var(--bg-subtle);
}
.search-item-title {
  font-weight: 600;
  font-size: 0.95rem;
}
.search-item-desc {
  font-size: 0.82rem;
  opacity: 0.75;
  margin-top: 2px;
}
.search-empty {
  padding: 24px;
  text-align: center;
  opacity: 0.6;
}
</style>

<script>
(function() {
  // 1. Theme Switcher Engine (Light / Dark / System)
  const storedTheme = localStorage.getItem('theme-mode') || 'system';
  function applyTheme(mode) {
    if (mode === 'system') {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
    } else {
      document.documentElement.setAttribute('data-theme-mode', mode);
    }
    localStorage.setItem('theme-mode', mode);
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme-mode') === mode);
    });
  }
  
  applyTheme(storedTheme);
  
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((localStorage.getItem('theme-mode') || 'system') === 'system') {
      applyTheme('system');
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(localStorage.getItem('theme-mode') || 'system');
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-theme-mode');
        applyTheme(mode);
      });
    });

    // 2. Search Modal & Engine
    let searchIndex = null;
    const modal = document.getElementById('searchModal');
    const input = document.getElementById('searchInput');
    const results = document.getElementById('searchResults');
    const trigger = document.getElementById('searchTrigger');
    const closeBtn = document.getElementById('searchClose');

    async function loadSearch() {
      if (!searchIndex) {
        try {
          const res = await fetch('/search-index.json');
          if (res.ok) searchIndex = await res.json();
        } catch (e) {
          searchIndex = [];
        }
      }
    }

    function openSearch() {
      if (!modal) return;
      modal.style.display = 'flex';
      loadSearch();
      setTimeout(() => input && input.focus(), 50);
    }

    function closeSearch() {
      if (!modal) return;
      modal.style.display = 'none';
      if (input) input.value = '';
      if (results) results.innerHTML = '<div class="search-empty">Type to search...</div>';
    }

    if (trigger) trigger.addEventListener('click', openSearch);
    if (closeBtn) closeBtn.addEventListener('click', closeSearch);
    if (modal) {
      modal.querySelector('.search-backdrop').addEventListener('click', closeSearch);
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openSearch();
      } else if (e.key === 'Escape' && modal && modal.style.display === 'flex') {
        closeSearch();
      }
    });

    if (input) {
      input.addEventListener('input', () => {
        const query = input.value.trim().toLowerCase();
        if (!query || !searchIndex || searchIndex.length === 0) {
          results.innerHTML = '<div class="search-empty">Type to search...</div>';
          return;
        }
        const matches = searchIndex.filter(item => 
          (item.title && item.title.toLowerCase().includes(query)) ||
          (item.description && item.description.toLowerCase().includes(query)) ||
          (item.content && item.content.toLowerCase().includes(query))
        ).slice(0, 8);

        if (matches.length === 0) {
          results.innerHTML = '<div class="search-empty">No results found for "' + query + '"</div>';
          return;
        }

        results.innerHTML = matches.map(item => `
          <a class="search-item" href="${item.url}">
            <div class="search-item-title">${item.title}</div>
            <div class="search-item-desc">${item.description || item.content || ''}</div>
          </a>
        `).join('');
      });
    }
  });
})();
</script>

</body>
</html>
