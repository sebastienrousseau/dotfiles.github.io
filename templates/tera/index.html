{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>{{ page.title | default(value=site.site_title) }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
</section>

<div class="page-content">
  {{ content | safe }}
</div>
{% endblock %}
