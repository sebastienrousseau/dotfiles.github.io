name: Pages

# Builds dotfiles.io with ssg and the Lucid theme shared with doc.dotfiles.io
# (scripts/build-site.py: every internal link resolves and no page loads a
# third-party origin), validates the HTML, and deploys to GitHub Pages
# (custom domain: dotfiles.io). Pull requests build and validate only;
# pushes to main also deploy. Pages is set to build_type=workflow, so this
# is the only deploy path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ssg (pinned release, SHA-256 verified)
        env:
          SSG_VERSION: 0.0.63
          SSG_SHA256: b8402ae9bb7a4443e30a4926f067b40feb89477f70a4c9a9d062622bab86ae36
        run: |
          set -euo pipefail
          asset="ssg-v${SSG_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/sebastienrousseau/static-site-generator/releases/download/v${SSG_VERSION}/${asset}"
          echo "${SSG_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ssg"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/ssg" ssg
          echo "$RUNNER_TEMP/ssg" >>"$GITHUB_PATH"

      - name: Shared theme matches doc.dotfiles.io
        # dotfiles.io and doc.dotfiles.io use one Lucid theme. Every file
        # except header.html and index.html must equal the copy in the
        # dotfiles repository (docs/site/themes/lucid/_layouts on main).
        run: |
          set -euo pipefail
          src=https://raw.githubusercontent.com/sebastienrousseau/dotfiles/main/docs/site/themes/lucid/_layouts
          drift=0
          for f in base.html footer.html page.html 404.html main.js styles.css skeletonic.min.css theme-init.js assets/logo.svg; do
            curl --proto '=https' --tlsv1.2 -fsSL "$src/$f" -o "$RUNNER_TEMP/theme-file"
            if ! cmp -s "$RUNNER_TEMP/theme-file" "_layouts/$f"; then
              echo "::error file=_layouts/$f::differs from the doc.dotfiles.io theme; copy it from the dotfiles repository"
              drift=1
            fi
          done
          exit "$drift"

      - name: Build the site and check links and origins
        # python3 (standard library only) is preinstalled on the runner.
        run: python3 scripts/build-site.py --out _site

      - name: Validate the HTML
        run: npx --yes html-validate@10 --config .htmlvalidate.json "_site/**/*.html"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
